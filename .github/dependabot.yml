version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Chicago"
    target-branch: "master"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "composer"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "America/Chicago"
    target-branch: "master"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "github-actions"
